<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Loyal Studios Management private workspace">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Loyal Management">
  <meta name="format-detection" content="telephone=no">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <title>Loyal Studios Management</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <script src="./config.js"></script>
  <style>
    :root{color-scheme:dark light;--bg:#0b0b0c;--panel:#111113;--border:#29292d;--text:#f4f4f5;--muted:#929299;--button:#f4f4f5;--button-text:#0b0b0c}
    @media(prefers-color-scheme:light){:root{--bg:#f7f7f5;--panel:#fff;--border:#dededb;--text:#111113;--muted:#68686f;--button:#111113;--button-text:#fff}}
    *{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none}
    #app{position:fixed;top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);width:auto;height:auto;border:0;background:var(--bg)}
    #splash{position:fixed;inset:0;z-index:5;display:grid;min-height:100%;min-height:100dvh;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));background:var(--bg);color:var(--text);transition:opacity .2s ease,visibility .2s ease}
    #splash.hide{opacity:0;visibility:hidden;pointer-events:none}.wrap{width:min(100%,520px);text-align:center}
    .logo{display:none;width:auto;max-width:min(310px,80vw);height:auto;max-height:118px;object-fit:contain;margin:0 auto 12px}
    .sub{margin-top:0;color:var(--muted);font-size:12px;line-height:1.5}.spinner{width:26px;height:26px;margin:22px auto 0;border:3px solid var(--border);border-top-color:var(--text);border-radius:50%;animation:spin .7s linear infinite}
    .actions{display:none;align-items:center;justify-content:center;gap:10px;margin-top:22px;flex-wrap:wrap}.actions.show{display:flex}.button{min-height:42px;padding:10px 15px;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text);font:inherit;font-size:13px;font-weight:700;line-height:1.2;text-decoration:none;cursor:pointer}.button.primary{border-color:var(--button);background:var(--button);color:var(--button-text)}.button:focus-visible{outline:2px solid var(--text);outline-offset:3px}
    .setup{display:none;margin-top:22px;padding:16px;border:1px solid var(--border);border-radius:14px;background:var(--panel);color:var(--text);font-size:13px;line-height:1.55;text-align:left}.setup.show{display:block}.setup code{display:block;margin-top:10px;padding:10px;border:1px solid var(--border);border-radius:9px;color:var(--muted);word-break:break-word}
    @keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){#splash{transition:none}.spinner{animation-duration:1.4s}}
  </style>
</head>
<body>
  <iframe id="app" title="Loyal Studios Management application" allow="clipboard-read; clipboard-write"></iframe>
  <div id="splash" role="status" aria-live="polite" aria-busy="true">
    <div class="wrap">
      <img id="logo" class="logo" alt="Loyal Studios Management">
      <div id="status" class="sub">Loading private workspace…</div>
      <div id="spinner" class="spinner" aria-hidden="true"></div>
      <div id="actions" class="actions"><button id="retry" class="button primary" type="button">Retry</button><a id="open-direct" class="button" target="_blank" rel="noopener noreferrer">Open directly</a></div>
      <div id="setup" class="setup"><strong>GitHub wrapper belum dikonfigurasi.</strong><div>Paste URL deployment Apps Script <code>/exec</code> ke <code>config.js → appUrl</code>.</div></div>
    </div>
  </div>
  <noscript>This wrapper requires JavaScript to load Loyal Studios Management.</noscript>
  <script>
    (()=>{
      const cfg=window.LSM_CONFIG||{};const title=String(cfg.title||'Loyal Studios Management').trim();const url=String(cfg.appUrl||'').trim();const slowLoadMs=Number(cfg.slowLoadMs)>0?Number(cfg.slowLoadMs):15000;const prefersDark=window.matchMedia('(prefers-color-scheme: dark)');
      const frame=document.getElementById('app'),splash=document.getElementById('splash'),logo=document.getElementById('logo'),status=document.getElementById('status'),spinner=document.getElementById('spinner'),actions=document.getElementById('actions'),retry=document.getElementById('retry'),openDirect=document.getElementById('open-direct'),setup=document.getElementById('setup');let slowTimer,loadAttempt=0;
      document.title=title;frame.title=`${title} application`;
      const addHeadLink=(rel,href,options={})=>{if(!href)return;const link=document.createElement('link');link.rel=rel;link.href=href;Object.entries(options).forEach(([k,v])=>link[k]=v);link.addEventListener('error',()=>link.remove());document.head.appendChild(link)};
      addHeadLink('icon',cfg.faviconUrl);addHeadLink('apple-touch-icon',cfg.appIconUrl);
      const themeMeta=document.querySelector('meta[name="theme-color"]');
      const applyTheme=()=>{const isDark=prefersDark.matches;themeMeta.content=isDark?(cfg.themeColorDark||'#0b0b0c'):(cfg.themeColorLight||'#f7f7f5');const candidates=[isDark?cfg.logoDarkUrl:cfg.logoLightUrl,cfg.logoUrl,isDark?cfg.logoLightUrl:cfg.logoDarkUrl].filter((c,i,l)=>c&&l.indexOf(c)===i);const tryLogo=i=>{if(i>=candidates.length){logo.removeAttribute('src');logo.style.display='none';return}logo.onload=()=>logo.style.display='block';logo.onerror=()=>tryLogo(i+1);logo.src=candidates[i]};logo.style.display='none';tryLogo(0)};
      applyTheme();prefersDark.addEventListener?.('change',applyTheme);

      const SESSION_CHANNEL='LSM_SESSION_V1',SESSION_KEY='lsm_trusted_session_token';
      const allowedSessionOrigin=origin=>{
        try{
          const host=new URL(origin).hostname;
          return origin==='https://script.google.com'||host==='script.googleusercontent.com'||host.endsWith('.googleusercontent.com');
        }catch(e){return false}
      };
      window.addEventListener('message',event=>{
        if(!event.data||event.data.channel!==SESSION_CHANNEL||!allowedSessionOrigin(event.origin))return;
        const type=event.data.type;
        if(type==='GET'){
          let token='';try{token=localStorage.getItem(SESSION_KEY)||''}catch(e){}
          try{event.source?.postMessage({channel:SESSION_CHANNEL,type:'TOKEN',token},'*')}catch(e){}
        }else if(type==='SET'){
          try{if(event.data.token)localStorage.setItem(SESSION_KEY,String(event.data.token))}catch(e){}
        }else if(type==='CLEAR'){
          try{localStorage.removeItem(SESSION_KEY)}catch(e){}
        }
      });
      try{navigator.storage?.persist?.().catch(()=>{})}catch(e){}
      if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{}))}

      const showSlowState=()=>{status.textContent='This is taking longer than expected. You can keep waiting, retry, or open the Apps Script app directly.';actions.classList.add('show')};
      const beginLoad=()=>{loadAttempt++;const attempt=loadAttempt;clearTimeout(slowTimer);splash.classList.remove('hide');splash.setAttribute('aria-busy','true');spinner.hidden=false;actions.classList.remove('show');setup.classList.remove('show');status.textContent='Loading private workspace…';frame.src=url;slowTimer=setTimeout(()=>{if(attempt===loadAttempt)showSlowState()},slowLoadMs)};
      if(!url||url.includes('PASTE_APPS_SCRIPT')){spinner.hidden=true;status.textContent='Setup required';setup.classList.add('show');splash.setAttribute('aria-busy','false');return}
      openDirect.href=url;retry.addEventListener('click',beginLoad);frame.addEventListener('load',()=>{clearTimeout(slowTimer);splash.setAttribute('aria-busy','false');setTimeout(()=>splash.classList.add('hide'),250)});frame.addEventListener('error',()=>{clearTimeout(slowTimer);spinner.hidden=true;status.textContent='The workspace could not be loaded. Please retry or open it directly.';actions.classList.add('show');splash.setAttribute('aria-busy','false')});beginLoad();
    })();
  </script>
</body>
</html>
